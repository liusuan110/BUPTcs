# 生产环境配置
spring:
  # 数据库配置
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false

# 服务器配置
server:
  port: ${PORT:8080}

# 日志配置
logging:
  level:
    com.buptcs: INFO
    org.springframework: WARN
    org.hibernate: WARN
  file:
    name: /var/log/cs-learning-assistant/application.log

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# 安全配置
management:
  endpoints:
    web:
      exposure:
        include: health,info