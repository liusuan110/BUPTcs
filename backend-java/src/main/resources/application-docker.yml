# Docker环境配置
spring:
  # 数据库配置
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/cs_learning}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-test-query: SELECT 1
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  
  # Redis配置
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redis123}
      database: 0

# 服务器配置
server:
  port: 8080

# 日志配置
logging:
  level:
    com.buptcs: INFO
    org.springframework: WARN
    org.hibernate: WARN

# JWT配置
jwt:
  secret: ${JWT_SECRET:docker-secret-key-not-for-production}
  expiration: 86400000

# AI服务配置
app:
  ai-service:
    base-url: ${APP_AI_SERVICE_BASE_URL:http://ai-service:8000}