# 开发环境配置
spring:
  # 数据库配置
  datasource:
    url: jdbc:postgresql://localhost:5432/cs_learning_dev
    username: cs_user
    password: cs_password
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
  
  # 开发工具
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# 日志配置
logging:
  level:
    com.buptcs: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# 开发环境JWT密钥(仅用于开发)
jwt:
  secret: dev-secret-key-not-for-production
  expiration: 3600000 # 1小时